services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: opsagent
      POSTGRES_PASSWORD: opsagent
      POSTGRES_DB: opsagent
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsagent"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  pgdata:
